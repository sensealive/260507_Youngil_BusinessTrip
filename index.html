<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>영일 출장자 현황 조회 사이트</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body class="page login-page">
    <main class="login-frame">
      <section class="login-card" aria-label="로그인">
        <div class="brand-block">
          <p class="brand-title">Youngil Business Trip</p>
          <h1>영일 출장자 현황 조회 사이트</h1>
        </div>

        <form class="login-form" id="loginForm">
          <div class="login-row">
            <label for="loginId">ID</label>
            <input id="loginId" type="text" placeholder="ID 입력" autocomplete="off" />
          </div>
          <div class="login-row">
            <label for="loginPassword">PASSWORD</label>
            <span class="password-shell">
              <input id="loginPassword" type="password" placeholder="비밀번호" autocomplete="off" />
              <button type="button" class="password-eye" aria-label="비밀번호 보기" tabindex="0" onclick="
                const pwInput = this.parentElement.querySelector('input');
                if (pwInput.type==='password') {
                  pwInput.type='text';
                  this.querySelector('svg use').setAttribute('href', '#eye-open');
                } else {
                  pwInput.type='password';
                  this.querySelector('svg use').setAttribute('href', '#eye-closed');
                }
              ">
                <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                  <use href="#eye-closed"></use>
                </svg>
              </button>
              <svg style="display:none;">
                <symbol id="eye-closed" viewBox="0 0 20 20">
                  <ellipse cx="10" cy="10" rx="8" ry="5" fill="none" stroke="#888" stroke-width="1.5"/>
                  <line x1="4" y1="16" x2="16" y2="4" stroke="#888" stroke-width="1.5"/>
                  <circle cx="10" cy="10" r="2.5" fill="none" stroke="#888" stroke-width="1.5"/>
                </symbol>
                <symbol id="eye-open" viewBox="0 0 20 20">
                  <ellipse cx="10" cy="10" rx="8" ry="5" fill="none" stroke="#888" stroke-width="1.5"/>
                  <circle cx="10" cy="10" r="2.5" fill="none" stroke="#888" stroke-width="1.5"/>
                </symbol>
              </svg>
            </span>
          </div>
          <div class="login-actions">
            <button class="primary-button login-button" type="submit">Login</button>
          </div>
        </form>
      </section>

      <footer class="copyright">Copy Right reserved by Tom Seo, 2026</footer>
    </main>
    <script type="module" src="src/app.js?v=7"></script>
  </body>
</html>
